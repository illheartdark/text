<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>贪吃蛇 · 游戏</title>
  <link rel="stylesheet" href="../../styles/base.css" />
  <link rel="stylesheet" href="../../styles/glass.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="glass-bg" aria-hidden="true">
    <div class="light-line light-line--cyan"></div>
    <div class="light-line light-line--purple"></div>
    <div class="light-line light-line--pink"></div>
    <div class="glass-line glass-line--a"><i class="glass-line__inner"></i></div>
    <div class="glass-line glass-line--b"><i class="glass-line__inner"></i></div>
    <div class="glass-line glass-line--c"><i class="glass-line__inner"></i></div>
  </div>

  <div class="play-shell" id="playShell">
    <header class="play-header">
      <a class="back-link" href="index.html">← 返回详情</a>
      <a class="back-link" href="../../../index.html">首页</a>
      <div class="play-score">
        <span>分数 <b id="score">0</b></span>
        <span>最高 <b id="best">0</b></span>
      </div>
    </header>

    <div class="play-stage" id="playStage">
      <main class="play-main glass-card" id="playMain">
        <canvas id="board" width="480" height="480"></canvas>
        <p class="play-tip" id="tip">按方向键或 WASD 开始 · 空格暂停 · R 重新开始</p>
        <div class="play-actions" id="playActions">
          <button class="primary" id="startBtn" type="button">开始</button>
          <button id="pauseBtn" type="button">暂停</button>
          <button id="restartBtn" type="button">重新开始</button>
          <button id="dpadBtn" type="button">方向键</button>
        </div>
      </main>
    </div>

    <div class="dpad" id="dpad" aria-hidden="true">
      <button class="dpad__btn dpad__btn--up" type="button" data-dir="up" aria-label="上">▲</button>
      <button class="dpad__btn dpad__btn--left" type="button" data-dir="left" aria-label="左">◀</button>
      <button class="dpad__btn dpad__btn--back" id="dpadBack" type="button" aria-label="返回">返回</button>
      <button class="dpad__btn dpad__btn--right" type="button" data-dir="right" aria-label="右">▶</button>
      <button class="dpad__btn dpad__btn--down" type="button" data-dir="down" aria-label="下">▼</button>
    </div>
  </div>

  <script src="../../shared/navigation.js"></script>
  <script src="../../shared/storage.js"></script>
  <script src="core.js"></script>
  <script src="play.js"></script>
</body>
</html>
