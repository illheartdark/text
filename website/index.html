<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>游戏大厅</title>
  <link rel="stylesheet" href="src/styles/base.css" />
  <link rel="stylesheet" href="src/styles/glass.css" />
  <link rel="stylesheet" href="src/styles/home.css" />
</head>
<body>
  <div class="glass-bg" aria-hidden="true">
    <div class="light-line light-line--cyan"></div>
    <div class="light-line light-line--purple"></div>
    <div class="light-line light-line--pink"></div>
    <div class="glass-line glass-line--a"><i class="glass-line__inner"></i></div>
    <div class="glass-line glass-line--b"><i class="glass-line__inner"></i></div>
    <div class="glass-line glass-line--c"><i class="glass-line__inner"></i></div>
  </div>

  <div class="home-shell">
    <header class="home-header">
      <span class="home-brand">游戏大厅</span>
      <button class="auth-entry" id="authEntry" type="button">登录</button>
    </header>

    <main class="home-main">
      <h1 class="home-title"><span class="grad">小游戏乐园</span></h1>
      <p class="home-sub">选择一个喜欢的小游戏，放松一下。</p>
      <div class="game-grid" id="gameGrid"></div>
    </main>

    <footer class="home-footer">v0.1.0 · 纯 CSS 玻璃拟态</footer>
  </div>

  <script src="src/shared/navigation.js"></script>
  <script src="src/components/game-card.js"></script>
  <script src="src/components/auth-entry.js"></script>
  <script src="src/pages/home.js"></script>
</body>
</html>
